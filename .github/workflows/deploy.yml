name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Digite 'true' para autorizar o build/push/deploy do oficina-execucao no GKE"
        required: true
        default: "false"
      gateway_host:
        description: "Hostname do API Gateway para CLIENT_JWKS_URL (opcional)"
        required: false
        default: ""

env:
  PROJECT_ID: "fiap-project-514922"
  REGION: "us-east1"
  CLUSTER_NAME: "oficina-gke-cluster"
  CLUSTER_ZONE: "us-east1-b"
  REPOSITORY: "oficina-docker"
  IMAGE_NAME: "oficina-execucao"

concurrency:
  group: deploy-oficina-execucao-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_deploy == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog')
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set environment metadata
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_canon=production" >> "$GITHUB_OUTPUT"
            echo "k8s_ns=oficina-prod" >> "$GITHUB_OUTPUT"
          else
            echo "env_canon=homolog" >> "$GITHUB_OUTPUT"
            echo "k8s_ns=oficina-homolog" >> "$GITHUB_OUTPUT"
          fi
          echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/936717667971/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-sa@fiap-project-514922.iam.gserviceaccount.com'

      - name: Set up Cloud SDK & GKE credentials
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: "gke-gcloud-auth-plugin"

      - name: Configure Docker & GKE
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          gcloud container clusters get-credentials "${CLUSTER_NAME}" --zone "${CLUSTER_ZONE}" --project "${PROJECT_ID}"

      - name: Build and push immutable Docker image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${{ steps.env.outputs.image_tag }}"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

      - name: Render Kubernetes manifests for ${{ steps.env.outputs.env_canon }}
        run: |
          ENV_CANON="${{ steps.env.outputs.env_canon }}"
          K8S_NS="${{ steps.env.outputs.k8s_ns }}"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${{ steps.env.outputs.image_tag }}"
          GW_HOST="${{ inputs.gateway_host }}"
          if [ -z "${GW_HOST}" ]; then
            GW_HOST="oficina-gateway-${ENV_CANON}.endpoints.${PROJECT_ID}.cloud.goog"
          fi

          mkdir -p /tmp/rendered-k8s
          cp k8s/*.yaml /tmp/rendered-k8s/

          for f in /tmp/rendered-k8s/*.yaml; do
            sed -i "s|us-east1-docker.pkg.dev/fiap-project-514922/oficina-docker/oficina-execucao:latest|${IMAGE_URI}|g" "$f"
            sed -i "s|oficina-execucao-homolog-sa|oficina-execucao-${ENV_CANON}-sa|g" "$f"
            sed -i "s|oficina-execucao-homolog|oficina-execucao-${ENV_CANON}|g" "$f"
            sed -i "s|oficina-backend-homolog|oficina-backend-${ENV_CANON}|g" "$f"
            sed -i "s|oficina-auth-homolog|oficina-auth-${ENV_CANON}|g" "$f"
            sed -i "s|oficina-admin-homolog|oficina-admin-${ENV_CANON}|g" "$f"
            sed -i "s|ENVIRONMENT: \"homolog\"|ENVIRONMENT: \"${ENV_CANON}\"|g" "$f"
            sed -i "s|DD_VERSION: \"latest\"|DD_VERSION: \"${{ steps.env.outputs.image_tag }}\"|g" "$f"
            sed -i "s|GATEWAY_HOST_PLACEHOLDER|${GW_HOST}|g" "$f"
          done

          kubectl create namespace "${K8S_NS}" --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy API and Worker
        run: |
          K8S_NS="${{ steps.env.outputs.k8s_ns }}"
          kubectl -n "${K8S_NS}" apply -f /tmp/rendered-k8s/serviceaccount.yaml
          kubectl -n "${K8S_NS}" apply -f /tmp/rendered-k8s/configmap.yaml
          kubectl -n "${K8S_NS}" apply -f /tmp/rendered-k8s/service.yaml
          kubectl -n "${K8S_NS}" apply -f /tmp/rendered-k8s/deployment.yaml
          kubectl -n "${K8S_NS}" apply -f /tmp/rendered-k8s/deployment-worker.yaml
          kubectl -n "${K8S_NS}" apply -f /tmp/rendered-k8s/hpa.yaml
          kubectl -n "${K8S_NS}" rollout status deployment/oficina-execucao --timeout=300s
          kubectl -n "${K8S_NS}" rollout status deployment/oficina-execucao-worker --timeout=300s
