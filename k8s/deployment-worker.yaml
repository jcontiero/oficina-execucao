apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-execucao-worker
  labels:
    app: oficina-execucao-worker
    tags.datadoghq.com/service: oficina-execucao-worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: oficina-execucao-worker
  template:
    metadata:
      labels:
        app: oficina-execucao-worker
        tags.datadoghq.com/service: oficina-execucao-worker
    spec:
      serviceAccountName: oficina-execucao-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: worker
          image: us-east1-docker.pkg.dev/fiap-project-514922/oficina-docker/oficina-execucao:latest
          imagePullPolicy: Always
          command: ["python", "-m", "src.worker"]
          envFrom:
            - configMapRef:
                name: oficina-execucao-config
          env:
            - name: DD_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DD_SERVICE
              value: "oficina-execucao-worker"
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
