[project]
name = "oficina-execucao"
version = "0.1.0"
description = "Microsserviço de Execução, Diagnóstico, Catálogo e Estoque (Firestore NoSQL) - FIAP Pos Tech"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.0",
    "PyJWT[crypto]>=2.8",
    "httpx>=0.27",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-pubsub>=2.20.0",
    "ddtrace>=2.10.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
